# Portable compose file. Works with `docker compose` and `podman-compose`.
#
# `user: "1000:1000"` makes the openttd/api containers write files owned
# by uid/gid 1000 on the host — matches a typical single-user Linux box.
# If your host uid differs, edit those lines.
#
# Alternative: systemd quadlet units (openttd.container, webui.container,
# api.container, openttd.network). Don't run both — same names and ports.
# Keep this file in sync with the .container/.network files when changing
# images, ports, or volumes.
#
# For rootless podman with cleaner subuid handling, also pass:
#   podman-compose -f compose.yaml -f compose.podman.yaml up

services:
  openttd:
    build: .
    image: localhost/openttd-server:latest
    container_name: openttd
    restart: unless-stopped
    ports:
      - "3979:3979/tcp"
      - "3979:3979/udp"
    volumes:
      - ./data:/data
    user: "1000:1000"
    dns:
      - 9.9.9.9
    # Pin the IPv4 since container has no IPv6 routing in rootless podman.
    extra_hosts:
      - "content.openttd.org:84.235.161.209"

  api:
    build: ./api
    image: localhost/openttd-api:latest
    container_name: openttd-api
    restart: unless-stopped
    volumes:
      - ./data:/data
    user: "1000:1000"
    environment:
      DATA_DIR: /data/.config/openttd

  webui:
    image: docker.io/nginx:alpine
    container_name: openttd-webui
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./webui:/usr/share/nginx/html:ro
      - ./webui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
