<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTTD Config Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="drop-overlay">
  <div class="drop-card" data-i18n="drop_files">Drop .cfg files to load</div>
</div>
<header>
  <h1>OpenTTD Config Editor</h1>
  <div class="actions">
    <select id="lang" class="btn" title="Språk">
      <option value="sv">Svenska</option>
      <option value="en">English</option>
    </select>
    <a class="btn" data-i18n="wiki_link" href="https://wiki.openttd.org/en/Archive/Manual/Settings/Openttd.cfg" target="_blank" rel="noopener">OpenTTD wiki ↗</a>
    <label class="btn">
      <input type="file" id="upload" accept=".cfg" multiple hidden>
      <span data-i18n="upload_cfg">Upload .cfg files</span>
    </label>
    <span id="api-status" class="api-status">●</span>
    <button id="server-load" class="btn" data-i18n="load_from_server" disabled>Load from server</button>
    <button id="server-save" class="btn" data-i18n="save_to_server" disabled>Save to server</button>
    <button id="apply-restart" class="btn primary" data-i18n="apply_restart" disabled>Save + restart server</button>
    <button id="fresh-start" class="btn danger" data-i18n="fresh_start" disabled>Start fresh game</button>
    <span class="btn-sep">|</span>
    <button id="dl-openttd" class="btn">openttd.cfg</button>
    <button id="dl-private" class="btn">private.cfg</button>
    <button id="dl-secrets" class="btn">secrets.cfg</button>
  </div>
</header>
<div class="layout">
  <aside id="nav"></aside>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search settings…">
      <label class="filter">
        <input type="checkbox" id="show-advanced">
        <span data-i18n="show_advanced">Show advanced + expert</span>
      </label>
    </div>
    <div id="settings"></div>
  </main>
</div>
<p id="status">Laddar schema…</p>
<script src="schema.js"></script>
<script src="app.js"></script>
</body>
</html>
