<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTTD Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header>
  <h1>OpenTTD Dashboard</h1>
  <div class="actions">
    <span id="conn-status" class="api-status">●</span>
    <a class="btn" href="/">⚙ Config editor</a>
  </div>
</header>
<main class="dash">
  <section class="card">
    <h2>Server</h2>
    <div id="server-info">—</div>
  </section>
  <section class="card">
    <h2>Players <span id="player-count" class="count">0</span></h2>
    <table id="players">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Company</th>
          <th>From</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="no-players" class="empty">No players connected.</p>
  </section>
  <section class="card">
    <h2>Chat <span id="chat-count" class="count">0</span></h2>
    <div id="chat-log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Say something to all players…" maxlength="900">
      <button type="submit" class="btn primary" id="chat-send">Send</button>
    </form>
  </section>
  <section class="card">
    <h2>Map <button id="refresh-map" class="btn" type="button" style="float:right;font-size:11px;padding:4px 9px;">Refresh</button></h2>
    <div id="map-wrap">
      <img id="map-img" alt="" hidden>
      <p id="map-empty" class="empty">Click <em>Refresh</em> to generate a minimap snapshot.</p>
    </div>
  </section>
  <section class="card wide">
    <h2>Economy
      <span class="h2-actions">
        <select id="econ-metric" class="btn" style="font-size:11px;padding:3px 6px;">
          <option value="money">Cash</option>
          <option value="loan">Loan</option>
          <option value="income">Income</option>
          <option value="value">Value</option>
        </select>
      </span>
    </h2>
    <svg id="econ-chart" viewBox="0 0 800 240"></svg>
    <div id="econ-tip" hidden></div>
  </section>
  <section class="card wide">
    <h2>Companies <span id="company-count" class="count">0</span>
      <span class="h2-actions">
        <select id="ai-pick" class="btn" style="font-size:11px;padding:3px 6px;"></select>
        <button id="spawn-ai" class="btn" type="button">Spawn AI</button>
        <button id="install-ai" class="btn" type="button" hidden>Install default AI</button>
      </span>
    </h2>
    <table id="companies">
      <thead>
        <tr>
          <th>ID</th>
          <th>Color</th>
          <th>Name</th>
          <th>Manager</th>
          <th>Type</th>
          <th>Inaugurated</th>
          <th>Money</th>
          <th>Loan</th>
          <th>Income/yr</th>
          <th>Cargo/yr</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="no-companies" class="empty">No companies yet.</p>
  </section>
</main>
<script src="dashboard.js"></script>
</body>
</html>
